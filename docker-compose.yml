
name: mcp-emr

services:
  # Python MCP Server (HTTP Service)
  mcp-server:
    build: ./mcp-server-python
    container_name: emr-mcp-server
    ports:
      - "8001:8001"  # Expose MCP server HTTP API
    env_file:
      - .env
    environment:
      # point at the external Spark FHIR server
      FHIR_SERVER_URL: http://10.201.205.101:8007/
      MCP_PORT: 8001
    networks:
      - emr-network

  # Python Backend API
  backend-api:
    build: ./backend-api-python
    container_name: emr-backend-api
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      # point at the HTTP MCP server service
      MCP_SERVER_URL: http://mcp-server:8001
      FHIR_SERVER_URL: http://10.201.205.101:8007/
      CORS_ORIGIN:    http://localhost:3000
    depends_on:
      - mcp-server
    networks:
      - emr-network

  # React Frontend
  frontend:
    build: ./frontend
    container_name: emr-frontend
    ports:
      - "3000:80"
    env_file:
      - .env
    environment:
      # point at the in-Docker backend
      VITE_API_URL: http://backend-api:3001
    depends_on:
      - backend-api
    networks:
      - emr-network

networks:
  emr-network:
    driver: bridge
