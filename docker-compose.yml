
name: mcp-emr

services:
  # Python MCP Server (HTTP Service)
  mcp-server:
    build: ./mcp-server-python
    container_name: emr-mcp-server
    ports:
      - "8888:8888"  # Expose MCP server HTTP API
    env_file:
      - .env
    environment:
      # point at the external Spark FHIR server
      FHIR_SERVER_URL: http://10.201.205.101:8007/
      MCP_PORT: 8888
    networks:
      - emr-network

  # Python Backend API
  backend-api:
    build: ./backend-api-python
    container_name: emr-backend-api
    ports:
      - "8004:8004"
    env_file:
      - .env
    environment:
      # point at the HTTP MCP server service
      MCP_SERVER_URL: http://mcp-server:8888
      FHIR_SERVER_URL: http://10.201.205.101:8007/
      CORS_ORIGIN:    http://localhost:3004
    depends_on:
      - mcp-server
    networks:
      - emr-network

  # React Frontend
  frontend:
    build: ./frontend
    container_name: emr-frontend
    ports:
      - "3004:80"
    env_file:
      - .env
    environment:
      # Use relative URL for API calls through nginx proxy
      VITE_API_URL: "http://localhost:8004"
    depends_on:
    
      - backend-api
    networks:
      - emr-network

networks:
  emr-network:
    driver: bridge
