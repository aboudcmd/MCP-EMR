<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Patient Input</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .container {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        .response {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0f0f0;
            border-radius: 4px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>EMR Chatbot - Patient Query Test</h1>
        
        <div class="input-group">
            <label for="patientId">Patient ID (MRN):</label>
            <input type="text" id="patientId" placeholder="e.g., 7311, 160278, 360056" value="7311">
        </div>
        
        <div class="input-group">
            <label for="message">Message:</label>
            <input type="text" id="message" placeholder="e.g., What are their conditions?" value="What are their latest vitals?">
        </div>
        
        <button onclick="sendQuery()">Send Query</button>
        
        <div id="response" class="response" style="display:none;"></div>
    </div>

    <script>
        async function sendQuery() {
            const patientId = document.getElementById('patientId').value;
            const message = document.getElementById('message').value;
            const responseDiv = document.getElementById('response');
            
            if (!message) {
                alert('Please enter a message');
                return;
            }
            
            responseDiv.style.display = 'block';
            responseDiv.textContent = 'Loading...';
            
            try {
                const requestBody = {
                    message: message,
                    conversationHistory: []
                };
                
                // Add patientId if provided
                if (patientId) {
                    requestBody.patientId = patientId;
                }
                
                const response = await fetch('http://localhost:3001/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    responseDiv.textContent = `Response:\n${data.response}\n\nPatient ID Used: ${patientId || 'None (extracted from message)'}`;
                } else {
                    responseDiv.textContent = `Error: ${data.detail || 'Unknown error'}`;
                }
            } catch (error) {
                responseDiv.textContent = `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
